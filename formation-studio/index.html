<head>

<title>Lineup a déménagé</title>
<script>
  // Lineup moved from /formation-studio/ to /lineup/: same page, same share link (#/join/…), same data (same site).

    var rest = location.pathname.replace(/^\/formation-studio\/?/, '').replace(/^index\.html$/, '');

  })();
</script>

  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0c0c10; color: #f2f2f5; font: 16px system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; }

<body>

  document.getElementById('go').href = 'https://kiy0ni.github.io/lineup/' + location.hash;
